<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Royal Palace Gold & Mogra Halo -->
    <radialGradient id="zareenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#faedd3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#bd9a5d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#785525" stop-opacity="0"/>
    </radialGradient>

    <!-- Fragrant Mogra Ivory Petal with Palace Gold Outline -->
    <linearGradient id="zareenMograPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdfbf5"/>
      <stop offset="85%" stop-color="#f5ecdc"/>
      <stop offset="100%" stop-color="#dfcaa6"/>
    </linearGradient>

    <!-- Palace Gold Filigree -->
    <linearGradient id="zareenGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedd3"/>
      <stop offset="50%" stop-color="#bd9a5d"/>
      <stop offset="100%" stop-color="#694b1f"/>
    </linearGradient>

    <!-- Emerald-Sage Royal Leaves -->
    <linearGradient id="zareenLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a87e"/>
      <stop offset="50%" stop-color="#556c45"/>
      <stop offset="100%" stop-color="#2d3d23"/>
    </linearGradient>

    <radialGradient id="zareenJewelCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe8a8"/>
      <stop offset="70%" stop-color="#c99f47"/>
      <stop offset="100%" stop-color="#6e4d18"/>
    </radialGradient>

    <filter id="zareenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a3617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#zareenGlow)"/>

  <g filter="url(#zareenShadow)">
    <!-- Palace Garden Leaves -->
    <g id="zareenLeaves">
      <path d="M 80,80 C 102,52 130,46 140,36 C 124,54 112,74 80,80 Z" fill="url(#zareenLeaf)"/>
      <path d="M 80,80 C 58,108 30,114 20,124 C 36,106 48,86 80,80 Z" fill="url(#zareenLeaf)"/>
      <path d="M 80,80 C 52,58 46,30 36,20 C 54,36 74,48 80,80 Z" fill="url(#zareenLeaf)"/>
      <path d="M 80,80 C 108,102 114,130 124,140 C 106,124 86,112 80,80 Z" fill="url(#zareenLeaf)"/>
    </g>

    <!-- Multi-layered Mogra (Jasmine) Petals -->
    <!-- Layer 1: Outer 8 Petals -->
    <g id="zareenOuterMogra">
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(45 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(90 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(135 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(180 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(225 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(270 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" transform="rotate(315 80 80)" fill="url(#zareenMograPetal)" stroke="#bd9a5d" stroke-width="0.6"/>
    </g>

    <!-- Layer 2: Mid Mogra Petals (Offset by 22.5 deg) -->
    <g id="zareenMidMogra">
      <g transform="rotate(22.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(67.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(112.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(157.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(202.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(247.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(292.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
      <g transform="rotate(337.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="#ffffff" stroke="#bd9a5d" stroke-width="0.5"/></g>
    </g>

    <!-- Golden Palace Stamen Core -->
    <circle cx="80" cy="80" r="15" fill="#fffcf5" stroke="#bd9a5d" stroke-width="0.6"/>
    <circle cx="80" cy="80" r="8.5" fill="url(#zareenJewelCore)" stroke="#694b1f" stroke-width="0.6"/>
    <circle cx="78" cy="78" r="2.2" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
