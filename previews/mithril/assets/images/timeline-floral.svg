<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Pearlescent Crystal Aura -->
    <radialGradient id="mithrilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f0ebe1" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#c7baa4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8a9582" stop-opacity="0"/>
    </radialGradient>

    <!-- Pearl Sheen Petals -->
    <linearGradient id="mithrilPearlPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f6f2ea"/>
      <stop offset="80%" stop-color="#dfd5c4"/>
      <stop offset="100%" stop-color="#b8a892"/>
    </linearGradient>

    <!-- Crystal Sage Accents -->
    <linearGradient id="mithrilSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5c5"/>
      <stop offset="50%" stop-color="#8f9c89"/>
      <stop offset="100%" stop-color="#5a6854"/>
    </linearGradient>

    <!-- Heirloom Bronze Core -->
    <radialGradient id="mithrilBronzeCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8d6be"/>
      <stop offset="70%" stop-color="#a68862"/>
      <stop offset="100%" stop-color="#574229"/>
    </radialGradient>

    <filter id="mithrilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a3e30" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#mithrilGlow)"/>

  <g filter="url(#mithrilShadow)">
    <!-- Crystal Sage Tendrils -->
    <g id="mithrilLeaves">
      <path d="M 80,80 C 102,52 132,48 142,38 C 126,56 114,76 80,80 Z" fill="url(#mithrilSage)" opacity="0.85"/>
      <path d="M 80,80 C 58,108 28,112 18,122 C 34,104 46,84 80,80 Z" fill="url(#mithrilSage)" opacity="0.85"/>
      <path d="M 80,80 C 52,58 48,28 38,18 C 56,34 76,46 80,80 Z" fill="url(#mithrilSage)" opacity="0.85"/>
      <path d="M 80,80 C 108,102 112,132 122,142 C 104,126 84,114 80,80 Z" fill="url(#mithrilSage)" opacity="0.85"/>
    </g>

    <!-- 8 Lotus/Lily Petals with Heirloom Bronze Filigree -->
    <g id="mithrilOuter">
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(45 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(90 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(135 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(180 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(225 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(270 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
      <path d="M 80,80 C 64,54 66,24 80,16 C 94,24 96,54 80,80 Z" transform="rotate(315 80 80)" fill="url(#mithrilPearlPetal)" stroke="#a68862" stroke-width="0.5"/>
    </g>

    <!-- Inner Floating Petals -->
    <g id="mithrilInner" opacity="0.95">
      <g transform="rotate(22.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(67.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(112.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(157.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(202.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(247.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(292.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
      <g transform="rotate(337.5 80 80)"><path d="M 80,80 C 68,60 70,36 80,28 C 90,36 92,60 80,80 Z" fill="#ffffff" stroke="#c7baa4" stroke-width="0.4"/></g>
    </g>

    <!-- Pearl Center -->
    <circle cx="80" cy="80" r="16" fill="#fcf9f2" stroke="#a68862" stroke-width="0.6"/>
    <circle cx="80" cy="80" r="9" fill="url(#mithrilBronzeCore)" stroke="#574229" stroke-width="0.6"/>
    <circle cx="77.5" cy="77.5" r="2.5" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
