<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Soft golden ambient halo -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f0d396" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#c99b4a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ab7a2f" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Petals Gradient -->
    <linearGradient id="outerPetal" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="30%" stop-color="#f7e4be"/>
      <stop offset="70%" stop-color="#d4a758"/>
      <stop offset="100%" stop-color="#9a6e29"/>
    </linearGradient>

    <!-- Mid Petals Gradient -->
    <linearGradient id="midPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#faedd3"/>
      <stop offset="85%" stop-color="#dfb365"/>
      <stop offset="100%" stop-color="#b68436"/>
    </linearGradient>

    <!-- Inner Core Petals -->
    <linearGradient id="innerPetal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff4da"/>
      <stop offset="60%" stop-color="#e5bd71"/>
      <stop offset="100%" stop-color="#966723"/>
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a3b18a"/>
      <stop offset="50%" stop-color="#697a52"/>
      <stop offset="100%" stop-color="#495736"/>
    </linearGradient>

    <!-- Stamen / Core Accent -->
    <radialGradient id="coreGold" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffecb3"/>
      <stop offset="65%" stop-color="#d89e34"/>
      <stop offset="100%" stop-color="#6d460e"/>
    </radialGradient>

    <filter id="bloomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a3d1b" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="80" cy="80" r="76" fill="url(#ambientGlow)"/>

  <!-- Main Floral Group with Drop Shadow -->
  <g filter="url(#bloomShadow)">

    <!-- Botanical Tendrils / Leaves at 45 degree angles -->
    <g id="foliage">
      <!-- Top-right leaf -->
      <path d="M 80,80 C 95,55 125,50 135,42 C 122,58 110,75 80,80 Z" fill="url(#leafGrad)" opacity="0.85"/>
      <path d="M 80,80 C 92,60 115,50 128,46" stroke="#c2d1ab" stroke-width="0.8" fill="none" opacity="0.7"/>

      <!-- Bottom-left leaf -->
      <path d="M 80,80 C 65,105 35,110 25,118 C 38,102 50,85 80,80 Z" fill="url(#leafGrad)" opacity="0.85"/>
      <path d="M 80,80 C 68,100 45,110 32,114" stroke="#c2d1ab" stroke-width="0.8" fill="none" opacity="0.7"/>

      <!-- Top-left leaf -->
      <path d="M 80,80 C 55,65 50,35 42,25 C 58,38 75,50 80,80 Z" fill="url(#leafGrad)" opacity="0.85"/>
      <!-- Bottom-right leaf -->
      <path d="M 80,80 C 105,95 110,125 118,135 C 102,122 85,110 80,80 Z" fill="url(#leafGrad)" opacity="0.85"/>
    </g>

    <!-- Layer 1: Outer 8 Broad Petals -->
    <g id="outerPetals">
      <!-- 0 deg (Top) -->
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 45 deg -->
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(45 80 80)" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 90 deg (Right) -->
      <path d="M 80,80 C 104,62 132,64 142,80 C 132,96 104,98 80,80 Z" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 135 deg -->
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(135 80 80)" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 180 deg (Bottom) -->
      <path d="M 80,80 C 96,104 98,132 80,142 C 62,132 64,104 80,80 Z" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 225 deg -->
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(225 80 80)" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 270 deg (Left) -->
      <path d="M 80,80 C 56,96 28,94 18,80 C 28,64 56,62 80,80 Z" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
      <!-- 315 deg -->
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(315 80 80)" fill="url(#outerPetal)" stroke="#8e6224" stroke-width="0.5"/>
    </g>

    <!-- Layer 2: Mid Offset Petals (Offset by 22.5 deg) -->
    <g id="midPetals" opacity="0.95">
      <g transform="rotate(22.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(67.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(112.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(157.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(202.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(247.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(292.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
      <g transform="rotate(337.5 80 80)">
        <path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#midPetal)" stroke="#a1742c" stroke-width="0.4"/>
      </g>
    </g>

    <!-- Layer 3: Inner Blooming Bud -->
    <g id="innerBud">
      <circle cx="80" cy="80" r="24" fill="url(#innerPetal)" stroke="#7d541c" stroke-width="0.6"/>
      <!-- Soft scallop curves on inner bud -->
      <path d="M 80,60 C 86,60 92,66 92,73 C 92,80 86,84 80,84 C 74,84 68,80 68,73 C 68,66 74,60 80,60 Z" fill="url(#midPetal)" opacity="0.65"/>
      <path d="M 68,76 C 68,82 74,88 80,88 C 86,88 92,82 92,76" fill="none" stroke="#fff4db" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Layer 4: Golden Stamen Center & Pollen Anthers -->
    <g id="centerCore">
      <!-- Radiating Stamen Filaments -->
      <g stroke="#9d6e27" stroke-width="0.8" opacity="0.75">
        <line x1="80" y1="80" x2="80" y2="67"/>
        <line x1="80" y1="80" x2="89" y2="71"/>
        <line x1="80" y1="80" x2="93" y2="80"/>
        <line x1="80" y1="80" x2="89" y2="89"/>
        <line x1="80" y1="80" x2="80" y2="93"/>
        <line x1="80" y1="80" x2="71" y2="89"/>
        <line x1="80" y1="80" x2="67" y2="80"/>
        <line x1="80" y1="80" x2="71" y2="71"/>
      </g>

      <!-- Tiny Gold Anther Dots -->
      <circle cx="80" cy="67" r="1.6" fill="#ffe299"/>
      <circle cx="89" cy="71" r="1.6" fill="#ffe299"/>
      <circle cx="93" cy="80" r="1.6" fill="#ffe299"/>
      <circle cx="89" cy="89" r="1.6" fill="#ffe299"/>
      <circle cx="80" cy="93" r="1.6" fill="#ffe299"/>
      <circle cx="71" cy="89" r="1.6" fill="#ffe299"/>
      <circle cx="67" cy="80" r="1.6" fill="#ffe299"/>
      <circle cx="71" cy="71" r="1.6" fill="#ffe299"/>

      <!-- Central Jewel Pistil -->
      <circle cx="80" cy="80" r="9" fill="url(#coreGold)" stroke="#66410e" stroke-width="0.7"/>
      <circle cx="78" cy="78" r="2.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="81.5" cy="81.5" r="1" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Fine Petal Veins for Rich Tactile Luxury -->
    <g stroke="#ffffff" stroke-width="0.6" opacity="0.5" stroke-linecap="round">
      <path d="M 80,72 Q 80,45 80,28"/>
      <path d="M 72,80 Q 45,80 28,80"/>
      <path d="M 88,80 Q 115,80 132,80"/>
      <path d="M 80,88 Q 80,115 80,132"/>
    </g>

  </g>
</svg>
