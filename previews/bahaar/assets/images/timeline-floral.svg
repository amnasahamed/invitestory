<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Fresh Spring Garden Aura -->
    <radialGradient id="bahaarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#e2f0df" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#b8d4b3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7d927a" stop-opacity="0"/>
    </radialGradient>

    <!-- Spring Peony / Camellia Blush Petals -->
    <linearGradient id="bahaarOuterPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#faebec"/>
      <stop offset="70%" stop-color="#e8b8bd"/>
      <stop offset="100%" stop-color="#b7777f"/>
    </linearGradient>

    <linearGradient id="bahaarMidPetal" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f5d7d9"/>
      <stop offset="85%" stop-color="#d4929a"/>
      <stop offset="100%" stop-color="#9a565e"/>
    </linearGradient>

    <!-- Fresh Garden Sage Leaf Gradient -->
    <linearGradient id="bahaarLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a4c2a0"/>
      <stop offset="50%" stop-color="#648360"/>
      <stop offset="100%" stop-color="#3c5239"/>
    </linearGradient>

    <!-- Dewdrop Core -->
    <radialGradient id="bahaarCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff1c7"/>
      <stop offset="70%" stop-color="#e2ab46"/>
      <stop offset="100%" stop-color="#8a5f18"/>
    </radialGradient>

    <filter id="bahaarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2c3d2b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#bahaarGlow)"/>

  <g filter="url(#bahaarShadow)">
    <!-- Fresh Sage Leaves -->
    <g id="bahaarLeaves">
      <path d="M 80,80 C 100,50 130,45 140,35 C 125,55 115,75 80,80 Z" fill="url(#bahaarLeafGrad)"/>
      <path d="M 80,80 C 60,110 30,115 20,125 C 35,105 45,85 80,80 Z" fill="url(#bahaarLeafGrad)"/>
      <path d="M 80,80 C 50,60 45,30 35,20 C 55,35 75,45 80,80 Z" fill="url(#bahaarLeafGrad)"/>
      <path d="M 80,80 C 110,100 115,130 125,140 C 105,125 85,115 80,80 Z" fill="url(#bahaarLeafGrad)"/>
    </g>

    <!-- Layer 1: Peony Petals (10-fold organic bloom) -->
    <g id="bahaarOuter">
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(36 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(72 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(108 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(144 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(180 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(216 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(252 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(288 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
      <path d="M 80,80 C 60,54 62,24 80,16 C 98,24 100,54 80,80 Z" transform="rotate(324 80 80)" fill="url(#bahaarOuterPetal)" stroke="#7d927a" stroke-width="0.5"/>
    </g>

    <!-- Layer 2: Mid Petals -->
    <g id="bahaarMid">
      <g transform="rotate(18 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(54 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(90 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(126 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(162 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(198 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(234 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(270 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(306 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
      <g transform="rotate(342 80 80)"><path d="M 80,80 C 65,58 68,34 80,26 C 92,34 95,58 80,80 Z" fill="url(#bahaarMidPetal)" stroke="#b7777f" stroke-width="0.4"/></g>
    </g>

    <!-- Center Stamen Rosette -->
    <circle cx="80" cy="80" r="16" fill="#fcf0e3" stroke="#b7777f" stroke-width="0.6"/>
    <circle cx="80" cy="80" r="8.5" fill="url(#bahaarCore)" stroke="#6d4812" stroke-width="0.6"/>
    <circle cx="78" cy="78" r="2.2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
