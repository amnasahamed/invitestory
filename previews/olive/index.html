<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe3d3" />
    <meta name="description" content="You are warmly invited to the wedding of Rafael &amp; Ava · 15–18 October 2026." />
    <title>Rafael &amp; Ava — Wedding Invitation · Aranya</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%234c5636%22/%3E%3C/svg%3E" />
    <link rel="preload" as="image" href="assets/images/opening-poster-v3.webp" />
    <link rel="stylesheet" href="assets/css/olive.css?v=2" />
    <link rel="stylesheet" href="assets/css/experience-v3.css?v=3.1" />
    <link rel="stylesheet" href="assets/css/refinement-v4.css?v=4.4" />
    <link rel="stylesheet" href="assets/css/opening-v5.css?v=5" />
    <script src="/previews/names.js"></script>
    <script src="/previews/demo-guard.js"></script>
    <script src="assets/js/config.js?v=branding-1"></script>
    <script src="assets/js/v2-media.js?v=2"></script>
    <script src="assets/js/wed-calendar.js" defer></script>
    <script src="assets/js/wed-scratch.js" defer></script>
    <script src="assets/js/wed-leaves.js" defer></script>
    <script src="assets/js/app-playback-v5.js?v=5" defer></script>
    <script src="assets/js/experience-v3.js?v=3.2" defer></script>
    <script src="assets/js/refinement-v4.js?v=4" defer></script>
  <style>/* former Arabic text slots now hold English */.bismillah,.dua,.rs-dua,.rs-arabic,[lang="ar"],[dir="rtl"]{direction:ltr!important;unicode-bidi:normal!important}</style>
  <meta name="invitation-design" content="Aranya" />
  <link rel="stylesheet" href="../collection-branding.css?v=1" />
</head>
  <body>
    <div id="cover" class="cover" role="button" tabindex="0" aria-label="Open the invitation">
      <div class="cover-stage" id="coverStage">
        <video id="envVideo" class="cover-video" src="assets/video/opening-v3.mp4" poster="assets/images/opening-poster-v3.webp" muted playsinline webkit-playsinline preload="auto"></video>
      </div>
      <p class="cover-hint" id="coverHint"></p>
      <button type="button" class="skip" id="skip"></button>
      <div class="cover-veil" aria-hidden="true"></div>
    </div>

    <main id="page" class="page" aria-live="polite">
      <section class="hero" id="hero">
        <div class="hero-top">
          <div class="chandelier-drop"><img class="chandelier" src="assets/images/chandelier-v2.webp" alt="" aria-hidden="true" /></div>
          <div class="greenery-drop"><img class="greenery" src="assets/images/greenery-v2.webp" alt="" aria-hidden="true" /></div>
        </div>
        <div class="hero-text" id="heroText"></div>
        <div class="banquet-rise"><img class="banquet" src="assets/images/banquet-v2.webp" alt="" aria-hidden="true" /></div>
      </section>
      <div id="sections"></div>
    </main>

    <button type="button" class="music" id="musicBtn" hidden></button>
    <audio id="music" preload="none" loop></audio>
    <footer class="collection-signature collection-signature--botanical" aria-label="Aranya invitation design" style="--signature-ink:#46553d;--signature-paper:#f3f2e9">
    <span class="collection-signature__rule" aria-hidden="true"></span>
    <span class="collection-signature__name">Aranya</span>
    <span class="collection-signature__line">Rooted in togetherness</span>
  </footer>
</body>
</html>
