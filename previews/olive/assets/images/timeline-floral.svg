<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Warm Olive & Brass Aura -->
    <radialGradient id="oliveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f0f2e6" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#c5cca4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#626e4f" stop-opacity="0"/>
    </radialGradient>

    <!-- Olive Leaf Gradient -->
    <linearGradient id="oliveLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d9b73"/>
      <stop offset="50%" stop-color="#556341"/>
      <stop offset="100%" stop-color="#364028"/>
    </linearGradient>

    <!-- Warm White / Ivory Olive Petal -->
    <linearGradient id="olivePetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbf8ee"/>
      <stop offset="85%" stop-color="#e9e4ce"/>
      <stop offset="100%" stop-color="#cfc7a7"/>
    </linearGradient>

    <!-- Warm Brass Stamen Core -->
    <radialGradient id="oliveBrassCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fae39b"/>
      <stop offset="70%" stop-color="#c5a045"/>
      <stop offset="100%" stop-color="#664d12"/>
    </radialGradient>

    <filter id="oliveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2a3320" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#oliveGlow)"/>

  <g filter="url(#oliveShadow)">
    <!-- Slender Olive Leaves Flanking -->
    <g id="oliveLeaves">
      <path d="M 80,80 C 105,48 135,42 145,28 C 128,52 118,72 80,80 Z" fill="url(#oliveLeafGrad)"/>
      <path d="M 80,80 C 55,112 25,118 15,132 C 32,108 42,88 80,80 Z" fill="url(#oliveLeafGrad)"/>
      <path d="M 80,80 C 48,55 42,25 28,15 C 52,28 72,42 80,80 Z" fill="url(#oliveLeafGrad)"/>
      <path d="M 80,80 C 112,105 118,135 132,145 C 108,132 88,118 80,80 Z" fill="url(#oliveLeafGrad)"/>
    </g>

    <!-- 4-Petaled Wild Olive Blossom Cluster (Layered into 8) -->
    <g id="oliveOuterPetals">
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(45 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(90 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(135 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(180 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(225 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(270 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 68,26 80,18 C 92,26 94,54 80,80 Z" transform="rotate(315 80 80)" fill="url(#olivePetalGrad)" stroke="#8d9b73" stroke-width="0.6"/>
    </g>

    <!-- Warm Brass Stamen Core -->
    <circle cx="80" cy="80" r="16" fill="#fcf9ee" stroke="#8d9b73" stroke-width="0.5"/>
    <circle cx="80" cy="80" r="8.5" fill="url(#oliveBrassCore)" stroke="#554116" stroke-width="0.6"/>
    <circle cx="78" cy="78" r="2.2" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
