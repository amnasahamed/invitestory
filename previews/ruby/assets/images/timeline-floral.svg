<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Velvet Ruby & Gold Ambient Halo -->
    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdde2" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#b82d43" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#651a28" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3d0c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Crimson/Ruby Velvet Petals -->
    <linearGradient id="rubyOuterPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e84c63"/>
      <stop offset="40%" stop-color="#9e1f32"/>
      <stop offset="85%" stop-color="#651a28"/>
      <stop offset="100%" stop-color="#420d16"/>
    </linearGradient>

    <!-- Mid Velvet Petals with Warm Amber/Gold Sheen -->
    <linearGradient id="rubyMidPetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff7b8f"/>
      <stop offset="35%" stop-color="#c92a43"/>
      <stop offset="80%" stop-color="#801928"/>
      <stop offset="100%" stop-color="#540f1a"/>
    </linearGradient>

    <!-- Inner Rose Core -->
    <linearGradient id="rubyInnerCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaab6"/>
      <stop offset="60%" stop-color="#c92a43"/>
      <stop offset="100%" stop-color="#5e111d"/>
    </linearGradient>

    <!-- Royal Gold Leaf / Accent -->
    <linearGradient id="rubyGoldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedd3"/>
      <stop offset="50%" stop-color="#c59b48"/>
      <stop offset="100%" stop-color="#734e15"/>
    </linearGradient>

    <!-- Center Stamen Core -->
    <radialGradient id="rubyGoldStamen" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe8a3"/>
      <stop offset="70%" stop-color="#d4a339"/>
      <stop offset="100%" stop-color="#6e460b"/>
    </radialGradient>

    <filter id="rubyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3d0a11" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="80" cy="80" r="76" fill="url(#rubyGlow)"/>

  <g filter="url(#rubyShadow)">
    <!-- Gold leaf tendrils -->
    <g id="rubyFoliage">
      <path d="M 80,80 C 95,55 125,50 135,42 C 122,58 110,75 80,80 Z" fill="url(#rubyGoldLeaf)" opacity="0.9"/>
      <path d="M 80,80 C 65,105 35,110 25,118 C 38,102 50,85 80,80 Z" fill="url(#rubyGoldLeaf)" opacity="0.9"/>
      <path d="M 80,80 C 55,65 50,35 42,25 C 58,38 75,50 80,80 Z" fill="url(#rubyGoldLeaf)" opacity="0.9"/>
      <path d="M 80,80 C 105,95 110,125 118,135 C 102,122 85,110 80,80 Z" fill="url(#rubyGoldLeaf)" opacity="0.9"/>
    </g>

    <!-- Outer 8 Broad Velvet Petals -->
    <g id="rubyOuter">
      <path d="M 80,80 C 62,56 64,28 80,18 C 96,28 98,56 80,80 Z" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(45 80 80)" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 104,62 132,64 142,80 C 132,96 104,98 80,80 Z" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(135 80 80)" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 96,104 98,132 80,142 C 62,132 64,104 80,80 Z" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(225 80 80)" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 56,96 28,94 18,80 C 28,64 56,62 80,80 Z" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
      <path d="M 80,80 C 66,54 86,30 98,36 C 106,48 94,68 80,80 Z" transform="rotate(315 80 80)" fill="url(#rubyOuterPetal)" stroke="#c59b48" stroke-width="0.6"/>
    </g>

    <!-- Mid Offset Petals -->
    <g id="rubyMid">
      <g transform="rotate(22.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(67.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(112.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(157.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(202.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(247.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(292.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
      <g transform="rotate(337.5 80 80)"><path d="M 80,80 C 66,60 68,36 80,27 C 92,36 94,60 80,80 Z" fill="url(#rubyMidPetal)" stroke="#ffd782" stroke-width="0.5"/></g>
    </g>

    <!-- Inner Rose Bud Core -->
    <circle cx="80" cy="80" r="23" fill="url(#rubyInnerCore)" stroke="#ffd782" stroke-width="0.7"/>
    <path d="M 72,74 C 74,66 86,66 88,74 C 88,82 72,86 72,74 Z" fill="#ffccd4" opacity="0.8"/>
    <circle cx="80" cy="80" r="10" fill="url(#rubyGoldStamen)" stroke="#520d17" stroke-width="0.8"/>
    <circle cx="78" cy="78" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
