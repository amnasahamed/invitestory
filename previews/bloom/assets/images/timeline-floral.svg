<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Romantic Rose Aura -->
    <radialGradient id="bloomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f5" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f8d6dc" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#e89cb0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a94759" stop-opacity="0"/>
    </radialGradient>

    <!-- Watercolor Rose Petals -->
    <linearGradient id="bloomPetalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fce1e6"/>
      <stop offset="75%" stop-color="#de788e"/>
      <stop offset="100%" stop-color="#a94759"/>
    </linearGradient>

    <linearGradient id="bloomPetalGrad2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fff8f9"/>
      <stop offset="40%" stop-color="#f3aebb"/>
      <stop offset="85%" stop-color="#c45367"/>
      <stop offset="100%" stop-color="#8a2e3f"/>
    </linearGradient>

    <!-- Rose Leaf Gradient -->
    <linearGradient id="bloomLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b6c9a3"/>
      <stop offset="50%" stop-color="#7a9462"/>
      <stop offset="100%" stop-color="#495d36"/>
    </linearGradient>

    <!-- Rose Pistil -->
    <radialGradient id="bloomCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe6a8"/>
      <stop offset="75%" stop-color="#e5a837"/>
      <stop offset="100%" stop-color="#734907"/>
    </radialGradient>

    <filter id="bloomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4a1822" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#bloomGlow)"/>

  <g filter="url(#bloomShadow)">
    <!-- Leaves -->
    <g id="bloomLeaves">
      <path d="M 80,80 C 100,55 128,48 138,38 C 124,56 112,76 80,80 Z" fill="url(#bloomLeaf)" opacity="0.85"/>
      <path d="M 80,80 C 60,105 32,112 22,122 C 36,104 48,84 80,80 Z" fill="url(#bloomLeaf)" opacity="0.85"/>
      <path d="M 80,80 C 55,60 48,32 38,22 C 56,36 76,48 80,80 Z" fill="url(#bloomLeaf)" opacity="0.85"/>
      <path d="M 80,80 C 105,100 112,128 122,138 C 104,124 84,112 80,80 Z" fill="url(#bloomLeaf)" opacity="0.85"/>
    </g>

    <!-- Layer 1: Outer Petals (Heart-shaped English Rose curves) -->
    <g id="bloomOuter">
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" transform="rotate(60 80 80)" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" transform="rotate(120 80 80)" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" transform="rotate(180 80 80)" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" transform="rotate(240 80 80)" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
      <path d="M 80,80 C 62,50 58,26 73,19 C 80,24 87,24 94,19 C 109,26 105,50 80,80 Z" transform="rotate(300 80 80)" fill="url(#bloomPetalGrad1)" stroke="#d48a97" stroke-width="0.5"/>
    </g>

    <!-- Layer 2: Mid Petals (Rotated 30 deg) -->
    <g id="bloomMid">
      <g transform="rotate(30 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
      <g transform="rotate(90 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
      <g transform="rotate(150 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
      <g transform="rotate(210 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
      <g transform="rotate(270 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
      <g transform="rotate(330 80 80)"><path d="M 80,80 C 66,56 68,34 80,27 C 92,34 94,56 80,80 Z" fill="url(#bloomPetalGrad2)" stroke="#a94759" stroke-width="0.4"/></g>
    </g>

    <!-- Inner Rose Heart -->
    <circle cx="80" cy="80" r="18" fill="#fce4e8" stroke="#a94759" stroke-width="0.6"/>
    <circle cx="80" cy="80" r="8" fill="url(#bloomCore)" stroke="#801b2a" stroke-width="0.6"/>
    <circle cx="78" cy="78" r="2.2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
